<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Single dark look on purpose. Layout: sticky tab bar over a single 760px column; month scoreboard leads, lists below. */
:root{ color-scheme:dark;
  --bg:#1f1f21; --surface:#29292c; --ink:#ffffff; --muted:#b9b9be; --line:#3d3d42;
  --accent:#e3fc02; --accent-ink:#1f1f21; --accent-soft:#3a4010; --aqua:#00fced;
  --good:#00fced; --good-soft:#0c3b39; --warn:#ffc46b; --warn-soft:#3d2c0e; --gold:#e3fc02; --gold-soft:#3a4010;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{padding-top:22px;display:flex;flex-direction:column;gap:2px}
h1{font:700 40px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:10px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:none}
button{font:800 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sm{padding:5px 10px;font-size:13px}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
h2{font:700 17px/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
section{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted)}
.pips{display:flex;gap:6px}
.pip{width:34px;height:10px;border-radius:0;background:var(--line)}
.pip.f{background:var(--accent)}
.chip{display:inline-block;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:0;background:var(--line);color:var(--ink);white-space:nowrap}
.chip.C{background:var(--accent);color:var(--accent-ink)} .chip.S{background:var(--warn-soft);color:var(--warn)}
.chip.F{background:var(--aqua);color:var(--accent-ink)} .chip.ours{background:var(--good-soft);color:var(--good)}
.chip.open{background:transparent;border:1px solid var(--good);color:var(--good)} .chip.taken{color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .d{flex:none;width:46px;text-align:center;font-variant-numeric:tabular-nums}
.item .d b{display:block;font:700 20px/1 var(--display)} .item .d i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.item .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.item.past{opacity:.55} .item.today .d b{color:var(--accent)}
.t{font-weight:700} .m{color:var(--muted);font-size:14px}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=text],input[type=date],select,textarea{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:70px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:0;padding:10px 12px;font-size:14px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.code{font:700 16px ui-monospace,Menlo,monospace;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:0;user-select:all}
.done-t{text-decoration:line-through;color:var(--muted)}
a{color:var(--aqua)}
.bar{background:var(--aqua);color:var(--accent-ink);margin-inline:-16px;padding:8px 16px;text-align:center;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.08em}
.item.today .d b{color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.wk{font:700 13px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--aqua)}
</style>
</head>

const TABS=[['month','Posts'],['ideas','Ideas & rules']];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SETUP=[
 'Wait to announce until BadFlyer posts the announcement on Bad_Flyer',
 'Like, comment on, and share the announcement post to her story',
 'Post the ambassador graphic to her page',
 'Add "BadFlyer Ambassador" to her profile info',
 'Follow the badflyer_ambassadors page',
 'Once accepted, DM the ambassadors page her home state',
 'Fill out the media release and email it to bad.flyer1@gmail.com'];
let ok=true;
function load(){try{return JSON.parse(localStorage.getItem('bf-hub')||'{}')}catch(e){ok=false;return {}}}
let S=Object.assign({posts:[],ours:[],ideas:[],setup:{},refs:0,tab:'month'},load());
if(S.tab!=='ideas')S.tab='month';
function save(){try{localStorage.setItem('bf-hub',JSON.stringify(S))}catch(e){ok=false}document.getElementById('warn').hidden=ok}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let vm=TODAY.slice(0,7),wk=0,showOpen=false,showPrompts=false;
const shift=(ym,n)=>iso(new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1)).slice(0,7);
const row=s=>DATA.d.find(r=>r[0]===s);
const dbox=s=>{const d=pd(s);return `<div class="d"><b>${d.getDate()}</b><i>${DOW[d.getDay()]}</i></div>`};
function dayItem(r,btn){const p=DATA.p[r[2]];return `<div class="item">${dbox(r[0])}<div class="b"><div class="t">${esc(p[0])}</div><div class="m">${esc(p[1])}</div><div class="row">${btn}</div></div></div>`}

function vMonth(){
  const posts=S.posts.filter(p=>p.date.startsWith(vm)).sort((a,b)=>a.date<b.date?-1:1),n=posts.length;
  const isNow=vm===TODAY.slice(0,7),last=new Date(+vm.slice(0,4),+vm.slice(5),0).getDate(),left=last-(+TODAY.slice(8));
  const mn=MON[+vm.slice(5)-1];
  const msg=n>=4?'Done for '+mn+'.':isNow?`${4-n} more to post, ${left} day${left===1?'':'s'} left.`:`${4-n} short of the 4 required.`;
  const up=DATA.d.filter(r=>r[0]>=TODAY),nextC=up.find(r=>r[1]==='C'),mine=up.filter(r=>S.ours.includes(r[0]));
  const open=up.filter(r=>r[1]!=='C'&&!r[3]&&!S.ours.includes(r[0])).slice(0,8);
  const st=pd(TODAY);st.setDate(st.getDate()+wk*28);const en=new Date(st);en.setDate(en.getDate()+27);
  const four=DATA.d.filter(r=>r[0]>=iso(st)&&r[0]<=iso(en));const sh=d=>MON[d.getMonth()].slice(0,3)+' '+d.getDate();const rng=sh(st)+' to '+sh(en);
  const logBtn=r=>S.posts.some(x=>x.date===r[0])?'<span class="chip ours">Logged</span>':`<button class="sm" data-a="log" data-d="${r[0]}">Log this post</button>`;
  return `<section>
  <div class="panel"><div class="row"><button class="sm" data-a="vm" data-n="-1" aria-label="Previous month">‹</button><h2 class="grow">${mn} ${vm.slice(0,4)}</h2><button class="sm" data-a="vm" data-n="1" aria-label="Next month">›</button></div>
   <div class="score"><div class="big">${n}<small>/4</small></div><div><div class="pips">${[0,1,2,3].map(i=>`<span class="pip ${i<n?'f':''}"></span>`).join('')}</div><div class="m" style="margin-top:8px">${msg}</div></div></div>
   <div class="list">${posts.map(p=>`<div class="item">${dbox(p.date)}<div class="b">
     <div class="t">${esc(p.what)||'Post'}</div>
     <div class="row"><label class="ck"><input type="checkbox" id="tg-${p.id}" data-a="pf" data-f="tagged" data-id="${p.id}" ${p.tagged?'checked':''}>Tagged BadFlyer</label>
     <label class="ck"><input type="checkbox" id="dm-${p.id}" data-a="pf" data-f="dmd" data-id="${p.id}" ${p.dmd?'checked':''}>DM'd to Bad_Flyer</label>
     <button class="sm ghost" data-a="delp" data-id="${p.id}">Remove</button></div></div></div>`).join('')||'<div class="m">No posts logged yet this month.</div>'}</div>
   <form class="row" id="addpost"><input type="date" id="np-date" value="${isNow?TODAY:vm+'-01'}"><input type="text" id="np-what" class="grow" placeholder="What Asher posted"><button class="primary">Log post</button></form>
  </div>
  <div class="row"><button class="sm" data-a="wk" data-n="-1" aria-label="Previous four weeks">‹</button><h2 class="grow">Prompts, ${rng}</h2><button class="sm" data-a="wk" data-n="1" aria-label="Next four weeks">›</button></div>
  <div class="m">Prompts are optional ideas. Only the person who claims a date has to post it. Open and taken are from the sheet as of Oct 5.</div>
  ${[0,1,2,3].map(w=>{const rs=four.filter(r=>Math.floor((pd(r[0])-st)/6048e5+1e-6)===w);return rs.length?`<div class="panel"><div class="wk">Week ${w+1}</div><div class="list">${rs.map(r=>{
    const mineD=S.ours.includes(r[0]),st2=r[1]==='C'?'<span class="chip C">Contest, open to all</span>':mineD?'<span class="chip ours">Asher\'s date</span>':r[3]?'<span class="chip taken">Taken</span>':'<span class="chip open">Open</span>';
    const claim=r[1]==='C'||(r[3]&&!mineD)?'':`<button class="sm ghost" data-a="ours" data-d="${r[0]}">${mineD?'Unclaim':'Asher claimed this'}</button>`;
    return dayItem(r,st2+logBtn(r)+claim)}).join('')}</div></div>`:''}).join('')||'<div class="m">No prompts in these four weeks.</div>'}
  </section>`;
}

function vIdeas(){
  const seen=new Set(),pr=[];DATA.d.forEach(r=>{if(!seen.has(r[2])&&r[1]!=='C'&&r[1]!=='S'){seen.add(r[2]);pr.push(r[2])}});
  const r=S.refs;
  return `<section><h2>Post ideas</h2>
  <div class="panel"><form class="row" id="addidea"><input type="text" id="ni-text" class="grow" placeholder="Add an idea"><button class="primary">Add</button></form>
  <div class="list">${S.ideas.map(i=>`<div class="item"><div class="b"><div class="row"><label class="ck grow"><input type="checkbox" id="id-${i.id}" data-a="idone" data-id="${i.id}" ${i.done?'checked':''}><span class="${i.done?'done-t':''}">${esc(i.text)}</span></label><button class="sm ghost" data-a="deli" data-id="${i.id}">Remove</button></div></div></div>`).join('')||'<div class="m">Nothing saved yet. Check an idea off once it has been used.</div>'}</div></div>
  <div class="panel"><div class="row"><div class="grow"><div class="t">Need inspiration?</div><div class="m">${pr.length} prompts from BadFlyer's calendar. Use any of them, any day.</div></div><button class="sm" data-a="prompts">${showPrompts?'Hide':'Browse prompts'}</button></div>
   ${showPrompts?`<div class="list">${pr.map(i=>`<div class="item"><div class="b"><div class="t">${esc(DATA.p[i][0])}</div><div class="m">${esc(DATA.p[i][1])}</div><div class="row"><button class="sm" data-a="idea" data-i="${i}">Save to my ideas</button></div></div></div>`).join('')}</div>`:''}</div>
  <h2>Rules</h2>
  <div class="cols">
   <div class="panel"><h2>Every post</h2><ul class="plain"><li>Tag BadFlyer or make them a collab</li><li>DM the post to <b>Bad_Flyer</b></li><li>Reels need a good cover photo in BadFlyer gear</li><li>Clean background, gear visible, shoes on</li><li>Clean music, no swearing</li></ul></div>
   <div class="panel"><h2>Never</h2><ul class="plain"><li>Tag or collab the Ambassadors page</li><li>Hotel rooms, bedrooms, or beds</li><li>Adult themes</li><li>Paid promoters, promo pages, or "loops"</li></ul></div>
  </div>
  <div class="panel"><h2>Codes & links</h2><div class="row"><span class="code">Ambassador15</span><span class="grow m">BadFlyer and Raleigh Rhinestones. Not Rebel.</span></div><div class="row"><span class="code">Ambassador2</span><span class="grow m">$5 off Rebel. Stacks.</span></div>
   <div class="row"><button class="sm" data-a="ref" data-n="-1" aria-label="Remove one friend">−</button><b>${r}</b><button class="sm" data-a="ref" data-n="1" aria-label="Add one friend">+</button><span class="grow m">friends signed up. Every 5 earns free gear; ${5-(r%5)} to go.</span></div>
   <div class="m">Questions go by DM to <a href="https://www.instagram.com/bad_flyer/" target="_blank" rel="noopener">Bad_Flyer</a>, not the <a href="https://www.instagram.com/badflyer_ambassadors/" target="_blank" rel="noopener">Ambassadors page</a>.</div></div>
  </section>`;
}

function render(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
  document.getElementById('view').innerHTML=(S.tab==='ideas'?vIdeas:vMonth)();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,d=b.dataset.d;
  if(a==='tab'){S.tab=b.dataset.t;window.scrollTo(0,0)}
  else if(a==='vm')vm=shift(vm,+b.dataset.n);
  else if(a==='wk')wk+=+b.dataset.n;
  else if(a==='prompts')showPrompts=!showPrompts;
  else if(a==='ours'){S.ours=S.ours.includes(d)?S.ours.filter(x=>x!==d):S.ours.concat(d)}
  else if(a==='log'){S.posts.push({id:uid(),date:d,what:DATA.p[row(d)[2]][0],tagged:false,dmd:false});vm=d.slice(0,7)}
  else if(a==='idea'){const p=DATA.p[+b.dataset.i];S.ideas.push({id:uid(),text:p[0]+': '+p[1],done:false});b.textContent='Saved';b.disabled=true;save();return}
  else if(a==='delp')S.posts=S.posts.filter(p=>p.id!==b.dataset.id);
  else if(a==='deli')S.ideas=S.ideas.filter(p=>p.id!==b.dataset.id);
  else if(a==='ref')S.refs=Math.max(0,S.refs+ +b.dataset.n);
  else return;
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;if(!a)return;
  if(a==='pf'){const p=S.posts.find(x=>x.id===t.dataset.id);if(p)p[t.dataset.f]=t.checked}
  else if(a==='idone'){const p=S.ideas.find(x=>x.id===t.dataset.id);if(p)p.done=t.checked}
  else if(a==='setup')S.setup[t.dataset.i]=t.checked;
  else return;
  save();render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addpost'){const d=document.getElementById('np-date').value,w=document.getElementById('np-what').value.trim();if(!d)return;S.posts.push({id:uid(),date:d,what:w,tagged:false,dmd:false});vm=d.slice(0,7)}
  else if(e.target.id==='addidea'){const w=document.getElementById('ni-text').value.trim();if(!w)return;S.ideas.push({id:uid(),text:w,done:false})}
  save();render();
});
save();render();
</script>
